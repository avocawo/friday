name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How Friday could solve it. Project-specific behaviour belongs in profiles, so say what would be configured and what would change in the core.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
